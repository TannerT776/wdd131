<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Book blog">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Blog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>My Book Blog</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Books</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="blog-layout">
    <article class="book-card">
      
      <div class="book-details">
        <p><strong>Genre:</strong> Fantasy</p>
        <p><strong>Author:</strong> Shannon Hale</p>
        <p><strong>Published:</strong> 2005</p>
      </div>

      <div class="book-content">
        <h2>The Goose Girl</h2>
        <img 
          src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg" 
          alt="Cover of the book The Goose Girl">
        <p>
          This novel follows Princess Ani as she learns to speak with animals and discovers her true strength after being betrayed on her journey to a new kingdom.
        </p>
      </div>

    </article>
  </main>

  <footer>
