<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Character Card Project">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card</title>

  <!-- Social Media Meta -->
  <meta property="og:title" content="Character Card">
  <meta property="og:description" content="Swamp Beast Diplomat Character">
  <meta property="og:image" content="https://i.imgur.com/7yUvePI.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="card">
    <img src="https://i.imgur.com/7yUvePI.png" alt="Swamp Beast Diplomat">

    <h1 id="name"></h1>
    <p>Class: <span id="class"></span></p>
    <p>Level: <span id="level"></span></p>
    <p>Health: <span id="health"></span></p>

    <div class="buttons">
      <button id="attackBtn">Attack</button>
      <button id="levelBtn">Level Up</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
